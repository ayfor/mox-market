# Local Postgres 16 for development and integration tests (Standards §Stack).
#   docker compose up -d --wait db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mox_market
    ports:
      - "5432:5432"
    volumes:
      - mox-market-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mox_market"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mox-market-pg:
